name: Update homescreen logo
on:
  push:
    paths:
      - favicon.svg
      - .github/workflows/home-icon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Brillinger logo icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size, name in [(180,'shop-icon-180.png'),(192,'shop-icon-192.png'),(512,'shop-icon-512.png')]:
              cairosvg.svg2png(url='favicon.svg',write_to=name,output_width=size,output_height=size)
          PY
      - name: Commit updated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop-icon-180.png shop-icon-192.png shop-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh home screen icons with Brillinger logo"
            git push
          fi
